block_type: "transformer"   #核心架构类型，这里设置为 "transformer"，表明模型主要基于 Transformer 架构构建。
external_speaker_dim: 512   #外部说话人嵌入的维度大小。在多说话人语音合成等场景中，不同说话人的特征会被映射到一个固定维度的向量空间，这里维度为 512。

duration_modeling:
  learn_alignment: True  #决定是否在训练过程中学习文本和语音之间的对齐关系。设置为 True 时，模型会尝试自动学习文本与语音的对应关系。
  aligner_temperature: 0.0005  #对齐器的温度参数。在基于注意力机制的对齐过程中，温度参数用于调整注意力分布的平滑程度，值越小，注意力分布越集中。

#历史编码器
history_encoder:
  type: "Guo" # ["none", "Guo"]
  text_emb_size: 512    #文本嵌入的维度大小，即文本经过嵌入层后得到的向量维度为 512。
  max_history_len: 10    #最大历史长度，即模型能够处理的历史信息的最大长度为 10。
  duration_max: 898 # 最大时长值 d_min: 2, d_max: 898
  modal_hidden: 100  #模态编码器隐藏层的维度大小为 100。
  modal_layer: 2     #模态编码器的层数为 2。
  modal_head: 2      #模态编码器中注意力头的数量为 2。
  modal_kernel_size: 17    #模态编码器中卷积核的大小为 17。
  modal_dropout: 0.2    #模态编码器中 Dropout 层的丢弃率为 0.2，用于防止过拟合。
  cma_hidden: 100       #CMA（可能是某种特定的模块）隐藏层的维度大小为 100。
  cma_layer: 2
  cma_head: 4
  cma_filter_size: 256    #CMA 模块中卷积滤波器的数量为 256。
  cma_kernel_size: [9, 1] #CMA 模块中卷积核的大小为 [9, 1]。
  cma_dropout: 0.2
  context_layer: 2      #上下文编码器的层数为 2。
  context_hidden: 128    #上下文编码器隐藏层的维度大小为 128。
  context_dropout: 0.2

transformer:
  encoder_layer: 4     #Transformer 编码器的层数为 4。
  encoder_head: 2      #Transformer 编码器中注意力头的数量为 2。
  encoder_hidden: 256   #Transformer 编码器隐藏层的维度大小为 256。
  decoder_layer: 6
  decoder_head: 2      #Transformer 解码器中注意力头的数量为 2。
  decoder_hidden: 256
  conv_filter_size: 1024  #Transformer 中卷积层滤波器的数量为 1024。
  conv_kernel_size: [9, 1]  #Transformer 中卷积核的大小为 [9, 1]。
  encoder_dropout: 0.2
  decoder_dropout: 0.2
#Conformer 是一种在语音处理领域表现出色的神经网络架构，它结合了卷积神经网络（CNN）和 Transformer 的优点

conformer:
  encoder_layer: 4
  encoder_head: 8
  encoder_hidden: 256
  decoder_layer: 6
  decoder_head: 8
  decoder_hidden: 256
  feed_forward_expansion_factor: 4   #前馈网络的扩展因子为 4，用于控制前馈网络中间层的维度扩展倍数。
  conv_expansion_factor: 2    #卷积层的扩展因子为 2。
  conv_kernel_size: 31     #也许是一维卷积，卷积核大小为31
  half_step_residual: True   #决定是否使用半步进残差连接，半步进残差连接指的是将x分为两部分，x1和x2，只有x1或x2加上F，也就是[F(x1)+x1,F(x2)]
  encoder_dropout: 0.1
  decoder_dropout: 0.1

#方差预测器配置,variance_predictor 的核心目标是学习输入文本序列中每个音素或子词对应的韵律参数的方差（例如音高的方差、时长的方差），预测某个音素的音高波动范围。
variance_predictor:
  filter_size: 256
  kernel_size: 3
  dropout: 0.5
  cond_dur_layer: 2   #条件时长预测模块的层数为 2。
  cond_dur_head: 2
  cond_dur_hidden: 128
  conv_filter_size: 512   #方差预测器中卷积层滤波器的数量为 512。
  conv_kernel_size: [9, 1]
  cond_dur_dropout: 0.2

#方差嵌入配置
variance_embedding:
  kernel_size: 9    #方差嵌入层中卷积核的大小为 9。
  pitch_quantization: "linear" # support 'linear' or 'log', 'log' is allowed only if the pitch values are not normalized during preprocessing   #音高量化方式，选择 "linear" 表示线性量化，注释中提到也支持 "log" 对数量化，但要求音高值在预处理时未进行归一化。
  energy_quantization: "linear" # support 'linear' or 'log', 'log' is allowed only if the energy values are not normalized during preprocessing   #能量量化方式，同样选择 "linear" 线性量化，对数量化要求能量值在预处理时未进行归一化。
  n_bins: 256   #量化的桶数量为 256，用于将连续的音高或能量值离散化。

multi_speaker: True  #设置为 True 表示模型支持多说话人语音合成。
multi_emotion: True   #设置为 True 表示模型支持多情感语音合成。

max_seq_len: 1500 # max sequence length of DailyTalk is 1483   #模型能够处理的最大序列长度为 1500，注释中提到 DailyTalk 数据集的最大序列长度为 1483。

#声码器配置
vocoder:
  model: "HiFi-GAN" # support 'HiFi-GAN', 'MelGAN'   #声码器的模型类型，选择 "HiFi-GAN"，注释中提到也支持 "MelGAN"。
  speaker: "universal" # support  'LJSpeech', 'universal'  #声码器的说话人类型，选择 "universal"，注释中提到也支持 "LJSpeech"。通用型（Universal）说话人模型:不针对某个具体的说话人（如男性、女性、儿童等）进行训练，而是学习多说话人的混合特征，生成具有中性或泛化性的语音。
